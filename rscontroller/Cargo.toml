[package]
name = "rscontroller"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
enigo = "0.6.1" # Use the latest version
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
libp2p = { version = "0.56", features = ["tcp", "websocket", "mdns", "noise", "yamux"] }
libp2p-websocket = "0.45.1"
libp2p-mdns = { version = "0.48.0", features = ["tokio"] }
libp2p-noise = "0.46.1"
libp2p-yamux = "0.47.0"
libp2p-tcp = { version = "0.44.0", features = ["tokio"] }
async-trait = "0.1"
bytes = "1.5"
