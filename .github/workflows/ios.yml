name: iOS TestFlight
on:
  # push:
  #   branches:
  #     - main
  release:
    types: [published]

permissions:
  contents: read
  actions: read

jobs:
  build-and-release:
    if: ${{ !startsWith(github.ref_name, 'testflight-upload-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ./pycontroller
        run: npm ci
        shell: bash

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.10.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify Expo authentication
        working-directory: ./pycontroller
        run: eas whoami

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pycontroller/rustcore
          save-if: 'true'

      - name: Build Rust library for iOS device
        working-directory: ./pycontroller/rustcore
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --target aarch64-apple-ios --release --lib
          mkdir -p ../sensorlib/ios/libs
          cp target/aarch64-apple-ios/release/librustcore.a ../sensorlib/ios/libs/librustcore.a
          RUST_HOST=$(rustc -vV | sed -n 's/^host: //p')
          "$(rustc --print sysroot)/lib/rustlib/$RUST_HOST/bin/llvm-nm" --defined-only ../sensorlib/ios/libs/librustcore.a > "$RUNNER_TEMP/rustcore-symbols.txt"
          grep -q rustcore_convolution "$RUNNER_TEMP/rustcore-symbols.txt"

      - name: Build iOS app
        working-directory: ./pycontroller
        run: eas build --local -p ios --profile production --non-interactive --output app.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: sensorlab-testflight-ipa
          path: pycontroller/app.ipa
          retention-days: 7

      - name: 'Upload app to TestFlight'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: './pycontroller/app.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

  upload-existing-ipa:
    if: startsWith(github.ref_name, 'testflight-upload-')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify App Store Connect credentials
        run: node .github/scripts/testflight-status.mjs
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: sensorlab-testflight-ipa
          run-id: 37267007588
          github-token: ${{ github.token }}
          path: release-artifacts
      - name: Upload saved build 1.0.1 (23) to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: release-artifacts/app.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      - name: Verify Apple processing
        run: node .github/scripts/testflight-status.mjs --wait
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TESTFLIGHT_BUILD_NUMBER: '23'
