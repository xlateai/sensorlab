name: iOS TestFlight
on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./pycontroller
        run: npm ci
        shell: bash

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: 🦀 Build Rust library for iOS
        working-directory: ./pycontroller/rustcore
        shell: bash
        run: |
          chmod +x build-ios.sh
          ./build-ios.sh
          # Copy library to the location expected by the podspec
          mkdir -p ../sensorlib/libs
          echo "📁 Copying Rust library to podspec directory..."
          cp ../sensorlib/ios/libs/librustcore.a ../sensorlib/libs/librustcore.a
          echo "✅ Done copying Rust libraries"
          
      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          expo-cache: true
          working-directory: ./pycontroller
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS app
        working-directory: ./pycontroller
        run: eas build --local -p ios --profile production --non-interactive --output app.ipa

      - name: 'Upload app to TestFlight'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: './pycontroller/app.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
