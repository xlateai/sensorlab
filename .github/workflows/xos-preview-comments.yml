name: React Native preview comments

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  dispatch:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    steps:
      - name: checkout pinned command validator
        uses: actions/checkout@v4
        with:
          repository: xlateai/xos
          ref: ce6afee5495c3128e44ce5558ac60b0bb805034d
          # Centrally provisioned for trusted Xlate repositories; never entered
          # by an application developer during XOS Preview setup.
          token: ${{ secrets.XOS_REPO_TOKEN }}
          persist-credentials: false
          path: .xos-command-sdk
          sparse-checkout: .github/scripts
      - name: resolve permission and exact pull request head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/collaborators/${{ github.event.comment.user.login }}/permission" --jq .permission > "$RUNNER_TEMP/permission"
          gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.issue.number }}" > "$RUNNER_TEMP/pull.json"
      - name: authorize preview request
        id: authorize
        run: |
          python .xos-command-sdk/.github/scripts/preview-comment-command.py \
            --event "$GITHUB_EVENT_PATH" \
            --permission "$(cat "$RUNNER_TEMP/permission")" \
            --pull "$RUNNER_TEMP/pull.json"
      - name: dispatch exact-head preview workflow
        if: steps.authorize.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.authorize.outputs.head_ref }}
          HEAD_SHA: ${{ steps.authorize.outputs.head_sha }}
          COMMAND: ${{ steps.authorize.outputs.command }}
          PR_NUMBER: ${{ steps.authorize.outputs.pull_request_number }}
        run: |
          gh workflow run xos.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" \
            -f command-subject="$COMMAND" \
            -f pull-request-number="$PR_NUMBER" \
            -f expected-sha="$HEAD_SHA"
