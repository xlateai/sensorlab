name: React Native
run-name: React Native preview ${{ inputs.preview-request-id || github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      command-subject: { required: false, default: "" }
      pull-request-number: { required: false, default: "" }
      expected-sha: { required: false, default: "" }
      preview-request-id: { required: false, default: "" }
      signing-build-id: { required: false, default: "" }
      signing-platform: { required: false, default: "" }
      device-preparation-id: { required: false, default: "" }
      reissue-source-sha: { required: false, default: "" }
      signing-application-identifier: { required: false, default: "" }
      signing-environment: { required: false, default: "" }
      build-host: { required: false, default: "https://builds.xlate.ai" }
      preview-title: { required: false, default: "" }
      preview-what-changed: { required: false, default: "" }
      preview-what-to-test: { required: false, default: "" }

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: write

concurrency:
  # A signing child must not cancel the unsigned build waiting for its result.
  group: xos-${{ inputs.signing-build-id || github.event.pull_request.number || inputs.pull-request-number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-dispatch:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.valid }}
      defer_preview: ${{ steps.check.outputs.defer_preview }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          ACTUAL_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          echo 'defer_preview=false' >> "$GITHUB_OUTPUT"
          if [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" == "$ACTUAL_SHA" ]]; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo "::error::PR head moved from $EXPECTED_SHA to $ACTUAL_SHA; request a new preview"
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            subject="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA" --jq '.commit.message | split("\n")[0]')"
            first="${subject%% *}"
            if [[ "$first" == /preview || "$first" == '/preview(ios)' || "$first" == '/preview(android)' ]]; then
              if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "$GITHUB_REPOSITORY" ]]; then
                echo '::error::Signed previews are unavailable for fork pull requests'
                echo 'valid=false' >> "$GITHUB_OUTPUT"
              else
                echo 'defer_preview=true' >> "$GITHUB_OUTPUT"
                printf 'command=%s\n' "$first" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  dispatch-exact-preview:
    needs: validate-dispatch
    if: needs.validate-dispatch.outputs.valid == 'true' && needs.validate-dispatch.outputs.defer_preview == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: dispatch exact pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          subject="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message | split("\n")[0]')"
          command="${subject%% *}"
          gh workflow run xos.yml --ref "$HEAD_REF" \
            -f command-subject="$command" \
            -f pull-request-number="$PR_NUMBER" \
            -f expected-sha="$HEAD_SHA"

  react-native:
    needs: validate-dispatch
    if: needs.validate-dispatch.outputs.valid == 'true' && needs.validate-dispatch.outputs.defer_preview != 'true'
    uses: xlateai/preview-actions/.github/workflows/native-preview.yml@aa0db845347a6617dd2c270721bf0d1517c70677
    with:
      project-name: sensorlab
      xos-ref: ce6afee5495c3128e44ce5558ac60b0bb805034d
      project-adapter: react_native
      required-commands: ""
      project-path: pycontroller
      command-subject: ${{ inputs.command-subject || '' }}
      pull-request-number: ${{ inputs.pull-request-number || '' }}
      preview-request-id: ${{ inputs.preview-request-id || '' }}
      signing-build-id: ${{ inputs.signing-build-id || '' }}
      signing-platform: ${{ inputs.signing-platform || '' }}
      device-preparation-id: ${{ inputs.device-preparation-id || '' }}
      reissue-source-sha: ${{ inputs.reissue-source-sha || '' }}
      signing-application-identifier: ${{ inputs.signing-application-identifier || '' }}
      signing-environment: ${{ inputs.signing-environment || '' }}
      build-host: ${{ inputs.build-host || 'https://builds.xlate.ai' }}
      preview-title: ${{ inputs.preview-title || '' }}
      preview-what-changed: ${{ inputs.preview-what-changed || '' }}
      preview-what-to-test: ${{ inputs.preview-what-to-test || '' }}
    secrets:
      # Provisioned centrally for trusted Xlate repositories. XOS Preview setup
      # never asks an application developer to create or paste this credential.
      XOS_REPO_TOKEN: ${{ secrets.XOS_REPO_TOKEN }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
